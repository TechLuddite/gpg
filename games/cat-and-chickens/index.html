<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Let the Cat Eat the Chickens - Grace's Playground</title>
<meta name="theme-color" content="#17b795">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%94%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/playground.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="../../">&larr; Playground</a>
    <h1>Don't Let the Cat Eat the Chickens</h1>
  </div>

  <div class="scoreboard">
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Round</span><span class="value" id="round">1</span></div>
    <div class="stat"><span class="label">Chickens</span><span class="value" id="chickens">3</span></div>
    <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="stage panel">
    <canvas id="canvas" aria-label="The chicken run. Tap a cat to shoo it away."></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-text">Cats come from the left. Tap or click one to shoo it. Lose all three chickens and the game is over.</p>
      <button class="btn btn-mint" id="start" type="button">Start</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-ghost" id="pause" type="button">Pause</button>
    <span class="hint">Tap the cats. On a keyboard, <kbd>P</kbd> pauses and <kbd>Enter</kbd> restarts.</span>
  </div>

  <p class="visually-hidden" role="status" id="announce"></p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
