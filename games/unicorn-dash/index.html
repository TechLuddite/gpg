<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Dash - Grace's Playground</title>
<meta name="theme-color" content="#a48cff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A6%84%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/playground.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="../../">&larr; Playground</a>
    <h1>Unicorn Dash</h1>
  </div>

  <div class="scoreboard">
    <div class="stat"><span class="label">Distance</span><span class="value" id="distance">0 m</span></div>
    <div class="stat"><span class="label">Stars</span><span class="value" id="stars">0</span></div>
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="stage panel">
    <canvas id="canvas" width="160" height="240" aria-label="A three lane race track"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Unicorn Dash</h2>
      <p id="overlay-text">Dodge the rocks. Collect the stars. It gets faster.</p>
      <button class="btn" id="start" type="button">Start</button>
    </div>
  </div>

  <div class="pads" aria-hidden="false">
    <button class="pad" id="pad-left" type="button" aria-label="Move left">&#9664;</button>
    <button class="pad" id="pad-right" type="button" aria-label="Move right">&#9654;</button>
  </div>

  <p class="hint">Arrow keys or <kbd>A</kbd> and <kbd>D</kbd> on a keyboard. On a phone, tap the side of the track or use the arrows.</p>

  <p class="visually-hidden" role="status" id="announce"></p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
