<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Maker - Grace's Playground</title>
<meta name="theme-color" content="#ff5fa2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%98%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/playground.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="../../">&larr; Playground</a>
    <h1>Emoji Maker</h1>
  </div>

  <div class="layout">
    <section class="panel preview-panel">
      <div class="preview-frame">
        <svg id="preview" viewBox="0 0 200 200" role="img" aria-label="Your emoji"></svg>
      </div>
      <div class="controls">
        <button class="btn btn-pink" id="random" type="button">Surprise me</button>
        <button class="btn btn-mint" id="save" type="button">Save sticker</button>
        <button class="btn btn-ghost" id="download" type="button">Download PNG</button>
      </div>
    </section>

    <section class="panel picker" aria-labelledby="picker-heading">
      <h2 id="picker-heading" class="visually-hidden">Parts</h2>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="options" id="options" role="tabpanel"></div>

      <h3>Colour</h3>
      <div class="swatches" id="skins" role="group" aria-label="Face colour"></div>

      <h3>Background</h3>
      <div class="swatches" id="backdrops" role="group" aria-label="Background colour"></div>
    </section>
  </div>

  <section class="panel book" aria-labelledby="book-heading">
    <h2 id="book-heading">Sticker book</h2>
    <p class="hint" id="book-empty">Nothing saved yet. Make a face you like and press Save sticker.</p>
    <ul class="sticker-grid" id="stickers"></ul>
  </section>

  <p class="visually-hidden" role="status" id="announce"></p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
