<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catwalk Contest - Grace's Playground</title>
<meta name="theme-color" content="#ff5fa2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/playground.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="../../">&larr; Playground</a>
    <h1>Catwalk Contest</h1>
  </div>

  <div class="scoreboard">
    <div class="stat"><span class="label">Round</span><span class="value" id="round">1 / 5</span></div>
    <div class="stat"><span class="label">Total</span><span class="value" id="total">0</span></div>
    <div class="stat"><span class="label">Best total</span><span class="value" id="best">-</span></div>
  </div>

  <section class="panel theme-card">
    <h2 id="theme-name">Beach Day</h2>
    <p id="theme-blurb">Sun, sand and something you can swim in.</p>
    <p class="tags" id="theme-tags"></p>
  </section>

  <div class="layout">
    <section class="panel model-panel">
      <svg id="model" viewBox="0 0 200 340" role="img" aria-label="Your model on the catwalk"></svg>
      <div class="controls">
        <button class="btn btn-ghost" id="shuffle" type="button">Shuffle</button>
        <button class="btn btn-pink" id="submit" type="button">Show the judges</button>
      </div>
    </section>

    <section class="panel wardrobe" aria-labelledby="wardrobe-heading">
      <h2 id="wardrobe-heading" class="visually-hidden">Wardrobe</h2>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="items" id="items" role="tabpanel"></div>
      <h3>Skin</h3>
      <div class="swatches" id="skins" role="group" aria-label="Skin colour"></div>
    </section>
  </div>

  <div class="stage">
    <div class="overlay" id="overlay" hidden>
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div id="overlay-detail" class="detail"></div>
      <button class="btn btn-mint" id="continue" type="button">Next round</button>
    </div>
  </div>

  <p class="visually-hidden" role="status" id="announce"></p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
