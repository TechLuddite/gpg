<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppy Match - Grace's Playground</title>
<meta name="theme-color" content="#37a7ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../shared/playground.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <a class="back" href="../../">&larr; Playground</a>
    <h1>Puppy Match</h1>
  </div>

  <div class="scoreboard">
    <div class="stat"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
    <div class="stat"><span class="label">Time</span><span class="value" id="time">0:00.0</span></div>
    <div class="stat"><span class="label">Pairs</span><span class="value" id="pairs">0 / 6</span></div>
    <div class="stat"><span class="label">Best score</span><span class="value" id="best">-</span></div>
  </div>

  <div class="controls">
    <div class="levels" role="group" aria-label="Difficulty">
      <button class="btn btn-ghost" data-level="easy" type="button">Easy</button>
      <button class="btn btn-ghost" data-level="medium" type="button">Medium</button>
      <button class="btn btn-ghost" data-level="hard" type="button">Hard</button>
    </div>
    <button class="btn" id="new-game" type="button">New game</button>
  </div>

  <div class="stage">
    <div class="board panel" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="overlay-title">All matched</h2>
      <p id="overlay-text"></p>
      <button class="btn btn-mint" id="again" type="button">Play again</button>
    </div>
  </div>

  <p class="visually-hidden" role="status" id="announce"></p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
